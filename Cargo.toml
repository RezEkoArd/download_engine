[workspace]
resolver = "2"
members = [
    "download_engine",
    "download_engine_gui/bridge_guard",
    "download_engine_gui/src-tauri",
]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
